name: "Create XCFramework and Deploy Swift-PM"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to build (e.g. release/2025.06.25T12.00.00)'
        required: true
      dry_run:
        description: 'Build only; skip S3 upload and Package.swift push'
        type: boolean
        default: true
      xcodeVersion:
        description: "Xcode version to use"
        required: false
        default: "26.4.1"
concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true
env:
  # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
  # Xcode path: `/Applications/Xcode_26.4.1.app`
  XCODE_VERSION: ${{ inputs.xcodeVersion || '26.4.1' }}
jobs:
  build:
    runs-on: macos-26
    if: github.repository != 'plaidev/karte-ios-sdk' && (inputs.dry_run == true || startsWith(inputs.branch, 'release/'))
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # Required for AWS OIDC authentication
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
          submodules: 'true'
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.email "git@users.noreply.github.com"
          git config user.name "github actions"
      - name: Configure AWS Credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.SPM_DEPLOY_AWS_ROLE_ARN }}
          role-session-name: MySessionName
      - name: Setup Gems
        run: bundle install
      - name: Select Xcode version
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Find Release Targets
        id: find-release-targets
        run: |
          XCCONFIGS=(`git diff origin/master --name-only | grep 'Version\.xcconfig$'`)
          for XCCONFIG in ${XCCONFIGS[@]}; do
            VERSION_DIFF=`git diff -U0 origin/master -- ${XCCONFIG} | grep '^[+-]' | grep -Ev '^(--- a/|\+\+\+ b/)'`
            if echo $VERSION_DIFF | grep -q 'MARKETING_VERSION'; then
              MODULE_NAME="$(dirname ${XCCONFIG}) "
              RELEASE_TARGETS+="${MODULE_NAME} "
              echo "#########################"
              echo "# ${MODULE_NAME}"
              echo "#########################"
              echo " "
            else
              echo 'VERSION_DIFF does not contain MARKETING_VERSION'
            fi
          done
          echo "TARGETS=${RELEASE_TARGETS}" >> $GITHUB_OUTPUT
      - name: Create XCFrameworks
        if: steps.find-release-targets.outputs.TARGETS != ''
        run: |
          ./scripts/create_xcframeworks.sh ${{ steps.find-release-targets.outputs.TARGETS }}
      - name: Upload xcframeworks to aws s3
        if: inputs.dry_run != true && steps.find-release-targets.outputs.TARGETS != ''
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://production-native-sdk/
          for TARGET in ${{ steps.find-release-targets.outputs.TARGETS }}; do
            TAG=`ruby scripts/bump_version.rb current-tag -p Karte.xcodeproj -t ${TARGET}`
            aws s3 cp ./xcframeworks/${TARGET}.xcframework.zip s3://production-native-sdk/ios/swiftpm/${TAG}/ --acl public-read
          done
      - name: Backup Swift-PM manifest file
        if: inputs.dry_run != true && steps.find-release-targets.outputs.TARGETS != ''
        run: cp Package.swift Package.swift.back
      - name: Generate GitHub App token
        if: inputs.dry_run != true && steps.find-release-targets.outputs.TARGETS != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_TEAM_GITHUB_APP_ID }}
          private-key: ${{ secrets.APP_TEAM_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure Git
        if: inputs.dry_run != true && steps.find-release-targets.outputs.TARGETS != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github actions"
          git config --global user.email "git@users.noreply.github.com"
      - name: Update Swift-PM manifest file
        if: inputs.dry_run != true && steps.find-release-targets.outputs.TARGETS != ''
        run: |
          rm Package.swift
          mv Package.swift.back Package.swift
          git add Package.swift
          git commit -m "Update spm manifest file"
          git push
