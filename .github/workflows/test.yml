name: "Test"
on:
  workflow_dispatch:
  push:
    branches:
      # `master` is tested in `publish.yml`.
      - develop
  pull_request:
    branches:
      - develop
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IOS_VERSION: "26.5"
  DEVICE_NAME: "iPhone 17"
jobs:
  test:
    # NOTE: Using `macos-26-xlarge` to avoid timing-dependent test failures.
    runs-on: macos-26-xlarge
    # NOTE: Using short timeout for recognizing hangs / slow tests.
    timeout-minutes: 10
    # NOTE: Run only in private repo.
    if: ${{ github.repository != 'plaidev/karte-ios-sdk' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Checkout git submodules
        run: |
          git submodule sync
          git submodule update --init
      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: '3.4'
          bundler-cache: true # Runs 'bundle install' and caches installed gems automatically
      - name: Run bump_version.rb tests
        run: bundle exec ruby scripts/test/bump_version_test.rb
      - name: Podspec lint
        run: bundle exec pod spec lint *.podspec --quick
      - name: Run tests
        run: |
          DESTINATION="platform=iOS Simulator,name=${{ env.DEVICE_NAME }},OS=${{ env.IOS_VERSION }}"
          xcodebuild test -workspace Karte.xcworkspace \
                          -scheme KarteTests \
                          -destination "${DESTINATION}" \
                          -derivedDataPath DerivedData \
                          -resultBundlePath "output/KarteTests_${{ env.IOS_VERSION }}.xcresult" \
                          -skipPackagePluginValidation \
                          -skipMacroValidation
      # NOTE: Upload test results only on failure to save storage costs
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KarteTests-${{ env.IOS_VERSION }}-Test-${{ github.run_number }}.xcresult
          path: output/KarteTests_${{ env.IOS_VERSION }}.xcresult
          retention-days: 1
  notify-slack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    if: always() && github.ref == 'refs/heads/develop' && github.repository != 'plaidev/karte-ios-sdk'
    permissions: {}
    steps:
      - name: Notify Slack on test failure
        if: needs.test.result == 'failure'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: 'Test workflow: Test job failed on develop branch'
          SLACK_COLOR: failure
