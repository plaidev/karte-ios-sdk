name: "Publish"
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - publish
          - dry_run
        default: 'dry_run'
env:
  IOS_VERSION: "26.5"
  DEVICE_NAME: "iPhone 17"
  EXECUTION_MODE: ${{ inputs.mode || 'publish' }}
jobs:
  # `test` is same as the job in `test.yml`.
  test:
    runs-on: macos-26-xlarge
    timeout-minutes: 20
    # NOTE: Run only in private repo. Block publish mode on non-master branches.
    if: ${{ github.repository != 'plaidev/karte-ios-sdk' && (github.ref == 'refs/heads/master' || inputs.mode == 'dry_run') }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Checkout git submodules
        run: |
          git submodule sync
          git submodule update --init
      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: '3.4'
          bundler-cache: true # Runs 'bundle install' and caches installed gems automatically
      - name: Podspec lint
        run: bundle exec pod spec lint *.podspec --quick
      - name: Run tests
        run: |
          DESTINATION="platform=iOS Simulator,name=${{ env.DEVICE_NAME }},OS=${{ env.IOS_VERSION }}"
          xcodebuild test -workspace Karte.xcworkspace \
                          -scheme KarteTests \
                          -destination "${DESTINATION}" \
                          -derivedDataPath DerivedData \
                          -resultBundlePath "output/KarteTests_${{ env.IOS_VERSION }}.xcresult" \
                          -skipPackagePluginValidation \
                          -skipMacroValidation
      # NOTE: Upload test results only on failure to save storage costs
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KarteTests-${{ env.IOS_VERSION }}-Publish-${{ github.run_number }}.xcresult
          path: output/KarteTests_${{ env.IOS_VERSION }}.xcresult
          retention-days: 1
  publish:
    needs: test
    runs-on: macos-26-xlarge
    timeout-minutes: 30
    # NOTE: Run only in private repo. Block publish mode on non-master branches.
    if: ${{ github.repository != 'plaidev/karte-ios-sdk' && (github.ref == 'refs/heads/master' || inputs.mode == 'dry_run') }}
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_TEAM_GITHUB_APP_ID }}
          private-key: ${{ secrets.APP_TEAM_GITHUB_APP_PRIVATE_KEY }}
          owner: plaidev
          repositories: |
            karte-ios-sdk
            karte-ios-dev
            karte-app-dev-docs
          permission-contents: write
          permission-actions: write
          permission-workflows: write
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0 # Fetch all history for proper git operations
      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: '3.4'
          # NOTE: bundler-cache is disabled for clean builds on release
      - name: Install gems
        run: bundle install
      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/plaidev/karte-ios-sdk".insteadOf "https://github.com/plaidev/karte-ios-sdk"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/plaidev/karte-ios-dev".insteadOf "https://github.com/plaidev/karte-ios-dev"
          git config --global user.name "github actions"
          git config --global user.email "git@users.noreply.github.com"
      - name: Set up sync repository
        run: |
          git remote add sync_repo https://github.com/plaidev/karte-ios-sdk.git || true
          git fetch sync_repo
      # NOTE: Verify Git authentication and push permissions before actual publish.
      - name: Dry run (Git authentication check)
        if: env.EXECUTION_MODE == 'dry_run'
        env:
          TEMP_BRANCH: ci-auth-test-${{ github.run_id }}
          TEMP_TAG: ci-auth-test-tag-${{ github.run_id }}
        run: |
          git push --dry-run sync_repo HEAD:refs/heads/${TEMP_BRANCH}
          git tag ${TEMP_TAG}
          git push --dry-run origin ${TEMP_TAG}
          git push --dry-run sync_repo ${TEMP_TAG}
          git tag -d ${TEMP_TAG}
      - name: Dry run
        if: env.EXECUTION_MODE == 'dry_run'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          bundle exec pod trunk me
          bundle exec pod lib lint --verbose --allow-warnings
      # Determine unpublished podspecs by checking whether Git tags exist.
      - name: Detect unpublished podspecs
        id: detect
        run: |
          set -euo pipefail
          PODSPECS=""
          for PODSPEC in *.podspec; do
            TARGET=${PODSPEC%.podspec}
            TAG=$(ruby scripts/bump_version.rb current-tag -p Karte.xcodeproj -t $TARGET)
            if ! git tag -l "$TAG" | grep -Fxq "$TAG"; then
              PODSPECS="${PODSPECS:+$PODSPECS }$PODSPEC"
            fi
          done
          echo "podspecs=$PODSPECS" >> "$GITHUB_OUTPUT"
          echo "Podspecs to be released: ${PODSPECS:-none}"
      - name: Publish
        id: publish
        if: env.EXECUTION_MODE == 'publish'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          UNPUBLISHED_PODSPECS: ${{ steps.detect.outputs.podspecs }}
        run: |
          if [ -n "$UNPUBLISHED_PODSPECS" ]; then
            echo "Podspecs to be released: $UNPUBLISHED_PODSPECS"
            bash ./scripts/publish.sh
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "Running sync only..."
            git push sync_repo master
            echo "published=false" >> $GITHUB_OUTPUT
          fi
      - name: Trigger documentation publish
        if: env.EXECUTION_MODE == 'publish' && success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run publish-docs.yml --ref master
      - name: Trigger sync iOS SDK changelog
        if: env.EXECUTION_MODE == 'publish' && success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run sync-ios-sdk-changelog.yml --repo plaidev/karte-app-dev-docs --ref main
      - name: Trigger deploy release feed in public repo
        if: env.EXECUTION_MODE == 'publish' && steps.publish.outputs.published == 'true' && success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run deploy-release-feed.yml --repo plaidev/karte-ios-sdk --ref master
  # NOTE: Running on `ubuntu-latest` since `rtCamp/action-slack-notify` cannot be used on macOS runners.
  # https://github.com/rtCamp/action-slack-notify/issues/22
  notify-slack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    if: always() && github.repository != 'plaidev/karte-ios-sdk'
    permissions: {}
    steps:
      - name: Notify Slack on test failure
        if: needs.test.result == 'failure'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: 'Publish workflow: Test job failed'
          SLACK_COLOR: failure
  notify-slack-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [publish]
    if: always() && github.repository != 'plaidev/karte-ios-sdk'
    permissions: {}
    steps:
      - name: Notify Slack on publish success
        if: needs.publish.result == 'success'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: 'Publish workflow completed successfully'
          SLACK_COLOR: success
      - name: Notify Slack on publish failure
        if: needs.publish.result == 'failure'
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: 'Publish workflow: Publish job failed'
          SLACK_COLOR: failure
