			shellPath = /bin/bash;
			shellScript = "TARGETS=(\"KarteUtilities\" \"KarteCore\" \"KarteInAppMessaging\" \"KarteRemoteNotification\" \"KarteVariables\" \"KarteVisualTracking\" \"KarteCrashReporting\")\nOUTPUT_DIR=${PROJECT_DIR}/frameworks\nUNIVERSAL_OUTPUTFOLDER=${BUILD_DIR}/${CONFIGURATION}-universal\n\nclean() {\n  if [ -d \"${OUTPUT_DIR}\" ]; then\n    rm -rf \"${OUTPUT_DIR}\"\n  fi\n}\n\nbuild() {\n  TARGET_NAME=$1\n\n  # make sure the output directory exists\n  mkdir -p \"${UNIVERSAL_OUTPUTFOLDER}\"\n  mkdir -p \"${OUTPUT_DIR}\"\n\n  # Step 1. Build Device and Simulator versions\n  xcodebuild -target \"${TARGET_NAME}\" -configuration ${CONFIGURATION} -sdk iphoneos ONLY_ACTIVE_ARCH=NO MACH_O_TYPE=staticlib BUILD_DIR=\"${BUILD_DIR}\" BUILD_ROOT=\"${BUILD_ROOT}\" clean build\n  xcodebuild -target \"${TARGET_NAME}\" -configuration ${CONFIGURATION} -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO MACH_O_TYPE=staticlib BUILD_DIR=\"${BUILD_DIR}\" BUILD_ROOT=\"${BUILD_ROOT}\" clean build\n\n  # Step 2. Copy the framework structure (from iphoneos build) to the universal folder\n  cp -R \"${BUILD_DIR}/${CONFIGURATION}-iphoneos/${TARGET_NAME}.framework\" \"${UNIVERSAL_OUTPUTFOLDER}/\"\n\n  # Step 3. Copy Swift modules from iphonesimulator build (if it exists) to the copied framework directory\n  SIMULATOR_SWIFT_MODULES_DIR=\"${BUILD_DIR}/${CONFIGURATION}-iphonesimulator/${TARGET_NAME}.framework/Modules/${TARGET_NAME}.swiftmodule/.\"\n  if [ -d \"${SIMULATOR_SWIFT_MODULES_DIR}\" ]; then\n    cp -R \"${SIMULATOR_SWIFT_MODULES_DIR}\" \"${UNIVERSAL_OUTPUTFOLDER}/${TARGET_NAME}.framework/Modules/${TARGET_NAME}.swiftmodule\"\n  fi\n\n  # Step 4. Create universal binary file using lipo and place the combined executable in the copied framework directory\n  lipo -create -output \"${UNIVERSAL_OUTPUTFOLDER}/${TARGET_NAME}.framework/${TARGET_NAME}\" \"${BUILD_DIR}/${CONFIGURATION}-iphonesimulator/${TARGET_NAME}.framework/${TARGET_NAME}\" \"${BUILD_DIR}/${CONFIGURATION}-iphoneos/${TARGET_NAME}.framework/${TARGET_NAME}\"\n\n  # Step 5. Convenience step to copy the framework to the project's directory\n  cp -R \"${UNIVERSAL_OUTPUTFOLDER}/${TARGET_NAME}.framework\" \"${OUTPUT_DIR}\"\n}\n\nclean\n\nfor TARGET_NAME in ${TARGETS[@]}; do\n  build $TARGET_NAME\ndone\n\n# Step 6. Convenience step to open the project's directory in Finder\nopen \"${OUTPUT_DIR}\"\n";
		};
